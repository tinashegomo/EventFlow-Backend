# Production profile: activate with --spring.profiles.active=prod (or SPRING_PROFILES_ACTIVE=prod).
#
# Every value below must be supplied through the environment. There are deliberately no
# fallbacks for secrets: if JWT_SECRET, DB_PASSWORD or CORS_ALLOWED_ORIGINS is missing the
# application fails to start instead of silently running with an insecure default.

# Schema is managed by migrations/DBA in production - never let Hibernate rewrite it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Connection pool sizing for a shared database server.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# JWT signing key - required, no default.
SecretJwtString=${JWT_SECRET}

# Comma-separated browser origins allowed to call the API - required, no default.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Keep stack traces out of production responses.
server.error.include-stacktrace=never
server.error.include-message=never
