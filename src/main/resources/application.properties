spring.application.name=EventManagementSystem

# Hosting platforms (Render, Railway, Fly.io, Cloud Run...) inject PORT.
# Locally nothing is injected, so the app stays on 8080.
server.port=${PORT:8080}

# Datasource credentials are read from the environment so no secret is committed.
# On a development machine, put DB_PASSWORD in backend/EventManagementSystem/local.properties
# (git-ignored), or export DB_USER / DB_PASSWORD before running the app.
spring.config.import=optional:file:./local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventflow}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jackson.serialization.write-dates-as-timestamps=false

# Browser origins allowed to call the API (comma-separated).
# Override with CORS_ALLOWED_ORIGINS in any deployed environment.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Daily document-status job (6-field Spring cron). Override with DOCUMENT_STATUS_CRON.
app.scheduler.document-status-cron=${DOCUMENT_STATUS_CRON:0 5 0 * * *}

# JWT signing key - override with JWT_SECRET in any shared or deployed environment.
# The production profile (application-prod.properties) requires JWT_SECRET with no default.
SecretJwtString=${JWT_SECRET:tinashegomo123456789tinashegomo123456789}

# Bootstrap admin created by DataSeeder on an empty database.
# The password has NO default: when SEED_ADMIN_PASSWORD is unset the seeder is
# skipped entirely, so no known credential ships in source. Set it in
# local.properties for local development, or as a real env var on a deployed host.
# The display name and phone used for the seeded account are the defaults in DataSeeder.
app.seed.admin.email=${SEED_ADMIN_EMAIL:tinashegomo96@gmail.com}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:}
